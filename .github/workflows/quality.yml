name: Quality

on:
  push:
  pull_request:

jobs:
  tests-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test_requirements.txt
      - name: Run tests with coverage gate
        run: pytest -q
      - name: Run Bandit
        run: bandit -q -r middleman proxy manage.py -x middleman/tests -s B101
      - name: Run pip-audit
        run: pip-audit