[pytest]
DJANGO_SETTINGS_MODULE = proxy.test_settings
python_files = tests.py test_*.py *_tests.py
# Caches stay in the virtualenv, also for direct `pytest` runs (make/run_tests.sh set these too).
cache_dir = .venv/.pytest_cache
addopts = --nomigrations -p no:warnings --cov=middleman --cov=proxy --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80 --benchmark-storage=file://.venv/.benchmarks
markers =
    functional: end-to-end tests over real HTTP (live server + local upstream); make test-functional
    acceptance: definition-of-done criteria of the current release; make test-acceptance
# coverage.xml is only written by `make ci` (--cov-report=xml), not on every run.
# Benchmarks (middleman/tests/benchmarks/bench_*.py) do not match python_files on
# purpose: they only run through `make bench`.
