[pytest]
DJANGO_SETTINGS_MODULE = proxy.test_settings
python_files = tests.py test_*.py *_tests.py
addopts = --nomigrations -p no:warnings --cov=middleman --cov=proxy --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-fail-under=80


env =
    DATABASE_URI=postgres://proxy-test:proxy-test12345@db-test/db-test
    ALLOWED_HOSTS=["*"]
    BASE_TARGET_URL=https://httpstatuses.com/
    POSTGRES_USER=proxy-test
    POSTGRES_PASSWORD=proxy-test12345
    POSTGRES_DB=db-test
    LOGLEVEL=DEBUG
